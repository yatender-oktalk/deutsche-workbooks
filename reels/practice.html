<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels</title>
<link rel="stylesheet" href="../assets/app-shell.css">
<link rel="stylesheet" href="reels.css">
</head>
<body class="level-mixed rl-body" data-dw-nosplash>

<div class="controls topbar no-print">
  <a href="index.html">&larr; Reels</a>
</div>

<div class="rl-progress"><div class="rl-progress-fill" id="rl-progress-fill"></div></div>
<div class="rl-counter" id="rl-counter"></div>

<div id="rl-stage" class="rl-stage rl-screen">
  <div class="rl-card" id="rl-card">
    <div class="rl-kicker" id="rl-kicker">&nbsp;</div>
    <div class="rl-front" id="rl-front">&nbsp;</div>
    <div class="rl-front-sub" id="rl-front-sub"></div>
    <button type="button" class="rl-speak" id="rl-speak" aria-label="Vorlesen" title="Vorlesen">&#128266;</button>
    <div class="rl-back" id="rl-back"></div>
  </div>
  <p class="rl-hint" id="rl-hint">Tippen: Bedeutung zeigen &middot; nochmal tippen / nach oben wischen: weiter &middot; nach unten wischen: zurück</p>
</div>

<div id="rl-quiz" class="rl-quiz rl-screen" hidden>
  <div class="rl-kicker">Kurzer Check</div>
  <div class="rl-quiz-progress" id="rl-quiz-progress"></div>
  <div class="rl-quiz-credit" id="rl-quiz-credit"></div>
  <div class="rl-quiz-q" id="rl-quiz-q"></div>
  <div class="rl-quiz-choices" id="rl-quiz-choices"></div>
  <button type="button" class="rl-quiz-skip" id="rl-quiz-skip">Check überspringen &rarr;</button>
</div>

<div id="rl-end" class="rl-end rl-screen" hidden>
  <h2>Fertig</h2>
  <p class="rl-end-note" id="rl-end-score"></p>
  <div class="rl-end-actions">
    <button type="button" id="rl-again">Nochmal</button>
    <a class="primary" href="index.html">Zurück</a>
  </div>
  <p class="rl-redirect" id="rl-redirect"></p>
</div>

<span id="tts-source" hidden></span>

<script src="../vocab/data/a1.js"></script>
<script src="../vocab/data/a2.js"></script>
<script src="../vocab/data/b1.js"></script>
<script src="../vocab/data/b2.js"></script>
<script src="../vocab/js/db.js"></script>
<script src="../vocab/js/srs.js"></script>
<script src="../workbooks/satz-data.js"></script>
<script src="../assets/listening.js"></script>
<script defer src="../assets/app-shell.js"></script>
<script>
(function () {
  "use strict";

  /* The card/quiz/end "screens" are fixed to the area below the app-shell
     topbar + this page's own back-link bar (see .rl-screen in reels.css).
     --rl-top-offset has a static fallback but is corrected here once the
     app-shell topbar has been injected (it's a deferred script, so it may
     not exist yet on the first tick), so the screens sit exactly below
     both bars regardless of font/box-model differences across devices. */
  function setTopOffset() {
    var topbarSpacer = document.querySelector(".dw-topbar-spacer");
    if (!topbarSpacer) { setTimeout(setTopOffset, 40); return; }
    var controls = document.querySelector(".controls.topbar");
    var offset = Math.ceil(controls ? controls.getBoundingClientRect().bottom : topbarSpacer.getBoundingClientRect().bottom);
    document.documentElement.style.setProperty("--rl-top-offset", offset + "px");
  }
  setTopOffset();
  window.addEventListener("resize", setTopOffset);

  var qs = new URLSearchParams(location.search);
  var src = qs.get("src") || "vocab";
  var deck = [];

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildVocabDeck() {
    var levels = (qs.get("lv") || "a1").split(",");
    var n = parseInt(qs.get("n"), 10);
    var pool = [];
    levels.forEach(function (lv) {
      var list = (window.VOCAB_RAW && window.VOCAB_RAW[lv]) || [];
      list.forEach(function (e) {
        if (e.translation_en) pool.push({ front: e.full, back: e.translation_en, kicker: lv.toUpperCase(), id: e.id, level: e.level, gender: e.article });
      });
    });
    shuffle(pool);
    if (n > 0) pool = pool.slice(0, n);
    return pool;
  }

  function buildSatzDeck(kind) {
    var bases = (window.DW_SATZ && window.DW_SATZ[kind]) || [];
    var out = [];
    bases.forEach(function (b) {
      b.steps.forEach(function (st) {
        out.push({
          front: b.base,
          frontSub: st.s + " — " + st.p,
          back: st.a,
          kicker: kind === "kreis" ? "Satzkreis" : "Satzleiter"
        });
      });
    });
    return out;
  }

  if (src === "kreis") deck = buildSatzDeck("kreis");
  else if (src === "leiter") deck = buildSatzDeck("leiter");
  else deck = buildVocabDeck();

  /* Vocab quiz answers are graded into the real Vokabeltrainer FSRS state
     (same VocabDB/srs.js used by vocab/practice.js), under whichever
     profile is currently active there, so a reels session counts toward
     the same due/learned/weak-words picture in vocab/stats.html instead
     of being invisible to it. Resolves to null (no writes happen) when
     there's no vocab profile to credit, or outside a vocab-source deck. */
  var vocabProfileP = (function () {
    if (src !== "vocab" || typeof VocabDB === "undefined") return Promise.resolve(null);
    var name = null;
    try { name = localStorage.getItem("vocab.activeProfile"); } catch (e) {}
    if (!name) return Promise.resolve(null);
    return VocabDB.listProfiles().then(function (profiles) {
      return profiles.some(function (p) { return p.name === name; }) ? name : null;
    }).catch(function () { return null; });
  })();

  function recordVocabReview(card, correct) {
    if (src !== "vocab" || !card.id) return;
    vocabProfileP.then(function (profile) {
      if (!profile) return;
      var entry = { id: card.id, level: card.level };
      return VocabDB.getCard(profile, entry.id).then(function (existing) {
        var c = existing || newCard(profile, entry);
        var isNew = !existing;
        gradeCard(c, correct ? "good" : "again");
        return VocabDB.putCard(c).then(function () {
          return VocabDB.logReview({
            profile: profile, entryId: entry.id, level: entry.level,
            mode: "reels-quiz", grade: correct ? "good" : "again", correct: correct,
            day: todayStr(), ts: Date.now()
          });
        }).then(function () {
          if (window.DW && DW.logActivity) DW.logActivity("vocab", "review", { level: entry.level, correct: !!correct, isNew: isNew });
        });
      });
    }).catch(function () {});
  }

  var idx = 0;
  var revealed = false;
  var seen = [];
  var mode = "cards"; // "cards" | "quiz" | "end"
  var redirectTimer = null;

  var elCard = document.getElementById("rl-card");
  var elKicker = document.getElementById("rl-kicker");
  var elFront = document.getElementById("rl-front");
  var elFrontSub = document.getElementById("rl-front-sub");
  var elBack = document.getElementById("rl-back");
  var elCounter = document.getElementById("rl-counter");
  var elProgress = document.getElementById("rl-progress-fill");
  var elStage = document.getElementById("rl-stage");
  var elHint = document.getElementById("rl-hint");
  var elQuiz = document.getElementById("rl-quiz");
  var elQuizProgress = document.getElementById("rl-quiz-progress");
  var elQuizCredit = document.getElementById("rl-quiz-credit");
  var elQuizQ = document.getElementById("rl-quiz-q");
  var elQuizChoices = document.getElementById("rl-quiz-choices");
  var elEnd = document.getElementById("rl-end");
  var elEndScore = document.getElementById("rl-end-score");
  var elRedirect = document.getElementById("rl-redirect");

  /* Which of the four gradient card themes (reels.css) to show — reuses
     the vocab entry's own article (der/die/das) so the colour anchor
     matches the word itself, falling back to the neutral/amber theme for
     non-nouns and for the Satzkreis/Satzleiter decks (no gender). */
  function themeClassFor(c) {
    if (c.gender === "der") return "rl-theme-der";
    if (c.gender === "die") return "rl-theme-die";
    if (c.gender === "das") return "rl-theme-das";
    return "rl-theme-neutral";
  }

  function renderCard() {
    if (deck.length === 0) { showEnd(); return; }
    var c = deck[idx];
    revealed = false;
    elCard.classList.remove("rl-revealed", "rl-theme-der", "rl-theme-die", "rl-theme-das", "rl-theme-neutral");
    elCard.classList.add(themeClassFor(c));
    elKicker.textContent = c.kicker || "";
    elFront.textContent = c.front;
    elFrontSub.textContent = c.frontSub || "";
    elBack.textContent = c.back;
    elCounter.textContent = (idx + 1) + " / " + deck.length;
    elProgress.style.width = Math.round(((idx) / deck.length) * 100) + "%";
  }

  function reveal() {
    revealed = true;
    elCard.classList.add("rl-revealed");
    var c = deck[idx];
    if (seen.indexOf(c) === -1) {
      seen.push(c);
      if (window.DW && DW.logActivity) DW.logActivity("reels", "card", { src: src });
    }
  }

  /* --------------------------------------------------- card transitions */

  /* State always updates instantly on every tap/swipe, however fast they
     come in — the slide is a cosmetic CSS animation layered on top and
     never gates input (a previous version blocked new taps until the
     in-flight transition finished, which silently dropped rapid taps and
     left the deck looking stuck). */
  function playCardAnim(cls) {
    elCard.classList.remove("rl-anim-up", "rl-anim-down");
    void elCard.offsetWidth; // restart the animation even if re-triggered before it finished
    elCard.classList.add(cls);
  }

  function changeCard(newIdx, forward, preReveal) {
    if (newIdx < 0) return;
    if (newIdx >= deck.length) { finishCards(); return; }
    idx = newIdx;
    renderCard();
    playCardAnim(forward ? "rl-anim-up" : "rl-anim-down");
    if (preReveal) reveal();
  }

  function goNext() { changeCard(idx + 1, true); }
  function goPrev() { if (idx > 0) changeCard(idx - 1, false, true); }

  function tapCard() {
    if (!revealed) reveal();
    else goNext();
  }

  /* ------------------------------------------------------------- swipe */

  var touchStartX = null, touchStartY = null;
  var suppressNextClick = false;

  elStage.addEventListener("touchstart", function (e) {
    if (mode !== "cards") return;
    var t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, { passive: true });

  elStage.addEventListener("touchmove", function (e) {
    if (mode !== "cards" || touchStartY === null) return;
    var t = e.touches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
      e.preventDefault(); // stop the page/browser from scrolling instead of us handling the swipe
    }
  }, { passive: false });

  elStage.addEventListener("touchend", function (e) {
    if (mode !== "cards" || touchStartY === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    touchStartY = null;
    if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) {
      e.preventDefault();
      suppressNextClick = true;
      setTimeout(function () { suppressNextClick = false; }, 400);
      if (dy < 0) tapCard();
      else goPrev();
    }
  }, { passive: false });

  /* ---------------------------------------------------------- quiz phase */

  var quizDeck = [];
  var quizIdx = 0;
  var quizCorrect = 0;
  var quizRan = false;

  function finishCards() {
    elProgress.style.width = "100%";
    if (deck.length >= 4) { startQuiz(); }
    else { showEnd(); }
  }

  function startQuiz() {
    mode = "quiz";
    quizRan = true;
    quizDeck = shuffle(deck.slice());
    quizIdx = 0;
    quizCorrect = 0;
    elStage.hidden = true;
    elHint.hidden = true;
    elQuiz.hidden = false;
    renderQuizQuestion();

    if (src === "vocab") {
      vocabProfileP.then(function (profile) {
        elQuizCredit.textContent = profile
          ? "Zählt für Vokabeltrainer-Profil „" + profile + "“"
          : "Kein Vokabeltrainer-Profil aktiv — zählt nicht mit";
      });
    }
  }

  function renderQuizQuestion() {
    var c = quizDeck[quizIdx];
    elQuizProgress.textContent = (quizIdx + 1) + " / " + quizDeck.length;
    elQuizQ.textContent = c.front + (c.frontSub ? " — " + c.frontSub.replace(/^[^—]+—\s*/, "") : "");

    var others = deck.filter(function (o) { return o.back !== c.back; });
    shuffle(others);
    var distractors = [];
    var usedBacks = {};
    for (var i = 0; i < others.length && distractors.length < 3; i++) {
      if (!usedBacks[others[i].back]) { usedBacks[others[i].back] = true; distractors.push(others[i].back); }
    }
    var choices = shuffle(distractors.concat([c.back]));

    elQuizChoices.innerHTML = "";
    choices.forEach(function (choice) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rl-quiz-choice";
      btn.textContent = choice;
      btn.addEventListener("click", function () { answerQuiz(btn, choice, c); });
      elQuizChoices.appendChild(btn);
    });
  }

  function answerQuiz(btn, choice, card) {
    if (elQuizChoices.classList.contains("rl-answered")) return;
    elQuizChoices.classList.add("rl-answered");
    var correctBack = card.back;
    var correct = choice === correctBack;
    if (correct) quizCorrect++;
    recordVocabReview(card, correct);
    Array.prototype.forEach.call(elQuizChoices.querySelectorAll(".rl-quiz-choice"), function (b) {
      if (b.textContent === correctBack) b.classList.add("rl-correct");
      else if (b === btn) b.classList.add("rl-wrong");
    });
    setTimeout(function () {
      elQuizChoices.classList.remove("rl-answered");
      if (quizIdx < quizDeck.length - 1) { quizIdx++; renderQuizQuestion(); }
      else { elQuiz.hidden = true; showEnd(); }
    }, 700);
  }

  document.getElementById("rl-quiz-skip").addEventListener("click", function () {
    elQuiz.hidden = true;
    quizRan = false;
    showEnd();
  });

  /* ---------------------------------------------------------------- end */

  function showEnd() {
    mode = "end";
    elStage.hidden = true;
    elHint.hidden = true;
    elQuiz.hidden = true;
    elEnd.hidden = false;
    elEndScore.textContent = deck.length + " Karten durchgesehen" +
      (quizRan ? " · " + quizCorrect + " von " + quizDeck.length + " im Check richtig." : ".");
    startRedirectCountdown();
  }

  function renderRedirect(secs) {
    elRedirect.innerHTML = 'Weiter zur Auswahl in ' + secs + 's &middot; <a href="#" id="rl-cancel-redirect">hier bleiben</a>';
  }

  function startRedirectCountdown() {
    var secs = 12;
    renderRedirect(secs);
    redirectTimer = setInterval(function () {
      secs--;
      if (secs <= 0) { clearInterval(redirectTimer); location.href = "index.html"; return; }
      renderRedirect(secs);
    }, 1000);
  }

  elRedirect.addEventListener("click", function (e) {
    if (e.target.id !== "rl-cancel-redirect") return;
    e.preventDefault();
    clearInterval(redirectTimer);
    elRedirect.textContent = "";
  });

  elCard.addEventListener("click", function () {
    if (suppressNextClick) { suppressNextClick = false; return; }
    tapCard();
  });

  document.getElementById("rl-speak").addEventListener("click", function (e) {
    e.stopPropagation();
    var c = deck[idx];
    var srcEl = document.getElementById("tts-source");
    srcEl.textContent = c.front;
    speakText("tts-source");
  });

  document.addEventListener("keydown", function (e) {
    if (mode !== "cards") return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); tapCard(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  });

  document.getElementById("rl-again").addEventListener("click", function () {
    clearInterval(redirectTimer);
    elCard.classList.remove("rl-anim-up", "rl-anim-down");
    idx = 0; seen = []; quizRan = false;
    mode = "cards";
    elEnd.hidden = true;
    elQuiz.hidden = true;
    elStage.hidden = false;
    elHint.hidden = false;
    if (src === "vocab") shuffle(deck);
    renderCard();
  });

  if (deck.length === 0) {
    elFront.textContent = "Keine Karten gefunden.";
  } else {
    renderCard();
  }
})();
</script>
</body>
</html>
