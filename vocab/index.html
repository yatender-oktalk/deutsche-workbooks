<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer</title>
<link rel="stylesheet" href="vocab.css">
</head>
<body class="level-mixed" id="body">

<div class="controls topbar">
  <a href="../index.html">&larr; Übersicht</a>
  <span id="profile-indicator"></span>
</div>

<div class="doc-header">
  <span class="level-badge">A1 &ndash; B2</span>
  <h1>Vokabeltrainer</h1>
  <div class="doc-meta">Wortschatz üben mit Karteikarten, Multiple Choice, Lücken und Hörverstehen</div>
</div>

<div id="profile-screen">
  <h2>Profil wählen</h2>
  <div class="profile-grid" id="profile-grid"></div>
  <div class="new-profile-row">
    <input type="text" id="new-profile-name" placeholder="Neues Profil, z. B. Yatender" maxlength="40">
    <button class="btn" id="create-profile-btn">Anlegen</button>
  </div>
</div>

<div id="setup-screen" hidden>
  <h2>Übung starten</h2>

  <div class="field-label">Niveau</div>
  <div class="chip-row" id="level-chips">
    <button class="chip active" data-level="a1">A1</button>
    <button class="chip active" data-level="a2">A2</button>
    <button class="chip active" data-level="b1">B1</button>
    <button class="chip active" data-level="b2">B2</button>
  </div>

  <div class="field-label">Übungsart</div>
  <div class="chip-row" id="mode-chips">
    <button class="chip active" data-mode="mixed">Gemischt</button>
    <button class="chip" data-mode="flashcard">Karteikarten</button>
    <button class="chip" data-mode="mcq">Multiple Choice</button>
    <button class="chip" data-mode="cloze">Lückentext</button>
    <button class="chip" data-mode="type">Wort tippen</button>
    <button class="chip" data-mode="listening">Hören</button>
  </div>

  <div class="field-label">Kartenzahl</div>
  <div class="chip-row" id="count-chips">
    <button class="chip" data-count="10">10</button>
    <button class="chip active" data-count="20">20</button>
    <button class="chip" data-count="40">40</button>
  </div>

  <div id="due-summary" class="doc-meta" style="text-align:center; margin: 1em 0;"></div>

  <button class="btn btn-block" id="start-btn">Übung starten</button>

  <div style="text-align:center; margin-top: 1.6em;">
    <a href="stats.html" id="stats-link">Statistik ansehen</a>
    &nbsp;&middot;&nbsp;
    <a href="#" id="switch-profile-link">Profil wechseln</a>
  </div>
</div>

<div class="doc-footer">
  <a href="../index.html">&larr; Zur Übersicht</a>
</div>

<script src="data/a1.js"></script>
<script src="data/a2.js"></script>
<script src="data/b1.js"></script>
<script src="data/b2.js"></script>
<script src="js/db.js"></script>
<script src="js/srs.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
