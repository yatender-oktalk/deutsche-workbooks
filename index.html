<script defer src="assets/app-shell.js"></script>
<script>
(function () {
  function start() {
    if (!window.DW) { return void setTimeout(start, 40); }

    document.getElementById("dw-today").textContent =
      new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    renderWeek();
    DW.renderRegister(document.getElementById("dw-register"), {});
    DW.onProfileChange = function () {
      renderWeek();
      DW.renderRegister(document.getElementById("dw-register"), {});
    };
  }

  function renderWeek() {
    var mount = document.getElementById("dw-week");
    var p = DW.readProfile();
    mount.className = "dw-week";

    if (!p) {
      mount.innerHTML =
        '<div class="dw-week-kicker">Erster Besuch</div>' +
        '<div class="dw-week-phase">Kurz einrichten</div>' +
        '<p class="dw-week-note">Name, aktuelles Niveau und &mdash; wenn vorhanden &mdash; dein Pr&uuml;fungstermin. Daraus baut die Startseite den n&auml;chsten Schritt und den Zeitplan.</p>';
      var b = document.createElement("button");
      b.className = "dw-btn dw-btn--primary";
      b.type = "button";
      b.textContent = "Fang hier an";
      b.addEventListener("click", DW.startOnboarding);
      mount.appendChild(b);
      return;
    }

    var f = DW.currentFocus(p);
    var hi = p.name ? ("Hallo " + escapeHtml(p.name) + " — ") : "";
    var links = f.links.map(function (l) {
      return '<li><a href="' + l.href + '">' + escapeHtml(l.title) + '</a>' +
             (l.tag ? '<span class="dw-wl-meta">' + escapeHtml(l.tag) + '</span>' : '') + '</li>';
    }).join("");
    mount.innerHTML =
      '<div class="dw-week-kicker">Diese Woche</div>' +
      '<div class="dw-week-phase">' + escapeHtml(f.heading) + '</div>' +
      '<p class="dw-week-note">' + hi + escapeHtml(f.note) + '</p>' +
      '<ul class="dw-week-links">' + links + '</ul>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  start();
})();
</script>
</body>
</html>
