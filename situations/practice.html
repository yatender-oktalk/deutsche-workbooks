<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesprächstrainer &ndash; Übung</title>
<link rel="stylesheet" href="../assets/app-shell.css">
<link rel="stylesheet" href="situations.css">
</head>
<body class="level-mixed" id="body" data-dw-nosplash>

<div class="controls topbar">
  <a href="index.html">&larr; Beenden</a>
  <span id="profile-indicator" class="profile-name"></span>
</div>

<div class="session-meta">
  <span id="progress-label">Situation 1 von 8</span>
</div>
<div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>

<div id="loading" class="empty-state">Lade Situationen&hellip;</div>

<div id="session-empty" class="empty-state" hidden>
  Für die gewählte Auswahl sind gerade keine Situationen fällig oder verfügbar.<br>
  <a href="index.html">Zurück zur Auswahl</a>
</div>

<div id="card-container" hidden></div>

<div id="summary-screen" hidden>
  <h2 style="text-align:center;">Sitzung beendet</h2>
  <div class="summary-stats">
    <div class="stat-tile"><div class="num" id="sum-total">0</div><div class="label">Situationen geübt</div></div>
  </div>
  <button class="btn btn-block" id="again-btn">Neue Runde</button>
  <div style="text-align:center; margin-top:1em;">
    <a href="index.html">Zur Auswahl</a>
  </div>
</div>

<span id="tts-source" hidden></span>

<div class="doc-footer">
  <a href="index.html">&larr; Übung beenden</a>
</div>

<script src="../assets/listening.js"></script>
<script src="data/b1.js"></script>
<script src="data/b2.js"></script>
<script src="js/db.js"></script>
<script src="js/srs.js"></script>
<script src="js/data.js"></script>
<script src="js/practice.js"></script>
<script defer src="../assets/app-shell.js"></script>
</body>
</html>
