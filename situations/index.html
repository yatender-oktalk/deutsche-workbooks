<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesprächstrainer</title>
<link rel="stylesheet" href="../assets/app-shell.css">
<link rel="stylesheet" href="situations.css">
</head>
<body class="level-mixed" id="body" data-dw-nosplash>

<div class="controls topbar">
  <a href="../index.html">&larr; Übersicht</a>
  <span id="profile-indicator"></span>
</div>

<div class="doc-header">
  <span class="level-badge">B1 &ndash; B2</span>
  <h1>Gesprächstrainer</h1>
  <div class="doc-meta">Alltagssituationen üben: Kontext lesen/hören, selbst antworten, Modellantwort &amp; Redemittel vergleichen, mit Karteikarten-Wiederholung</div>
</div>

<div id="profile-screen">
  <h2>Profil wählen</h2>
  <div class="profile-grid" id="profile-grid"></div>
  <div class="new-profile-row">
    <input type="text" id="new-profile-name" placeholder="Neues Profil" maxlength="40">
    <button class="btn" id="create-profile-btn">Anlegen</button>
  </div>
</div>

<div id="setup-screen" hidden>
  <h2>Übung starten</h2>

  <div class="field-label">Niveau</div>
  <div class="chip-row" id="level-chips">
    <button class="chip active" data-level="b1">B1</button>
    <button class="chip active" data-level="b2">B2</button>
  </div>

  <div class="field-label">Situation</div>
  <div class="chip-row" id="category-chips"></div>

  <div class="field-label">Anzahl <span id="count-value">5</span></div>
  <div class="slider-row">
    <input type="range" id="count-slider" min="1" max="25" value="5" step="1">
    <div class="slider-ticks"><span>1</span><span>25</span></div>
  </div>

  <div id="due-summary" class="doc-meta" style="text-align:center; margin: 1em 0;"></div>

  <button class="btn btn-block" id="start-btn">Übung starten</button>

  <div style="text-align:center; margin-top: 1.6em;">
    <a href="#" id="switch-profile-link">Profil wechseln</a>
  </div>
</div>

<div class="doc-footer">
  <a href="../index.html">&larr; Zur Übersicht</a>
</div>

<script src="data/b1.js"></script>
<script src="data/b2.js"></script>
<script src="js/db.js"></script>
<script src="js/srs.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script defer src="../assets/app-shell.js"></script>
</body>
</html>
